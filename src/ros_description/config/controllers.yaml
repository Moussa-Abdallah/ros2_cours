controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Contrôleur d'état des joints (obligatoire)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Contrôleur différentiel (le "cerveau" du robot)
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:

    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.28      # distance entre roues (m) → 2 × 0.14
    wheel_radius:     0.05      # rayon roue (m)

    wheel_separation_multiplier:     1.0
    left_wheel_radius_multiplier:    1.0
    right_wheel_radius_multiplier:   1.0

    enable_stamped_cmd_vel: false      # ← Twist au lieu de TwistStamped
                                # true  → /cmd_vel (TwistStamped)
    cmd_vel_timeout: 0.5        # s ; sans commande → stop
    publish_limited_velocity: true

    publish_rate: 50.0          # Hz
    odom_frame_id:  odom
    base_frame_id:   base_footprint
    enable_odom_tf:  true       # publie odom → base_footprint
    open_loop:       false      # true = pas de feedback (mauvais)
    position_feedback: true

    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0